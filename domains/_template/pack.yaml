# Copy this directory to domains/<your_domain>/ and fill every TODO field.
# Remove comments when done.
# Validated fields: domain, display_name, dispatcher_voice_id, non-empty roles.

# TODO: lowercase identifier, no spaces. Used as a label; the engine never branches on it.
domain: your_domain

# TODO: Human-readable name shown on the dashboard.
display_name: "Your Domain Name"

# TODO: Voice id for the single dispatcher voice that speaks routed messages.
dispatcher_voice_id: "Magpie-ZeroShot.Female-1"

# TODO: One entry per participant role.
#   role_id      — opaque snake_case key (e.g. role_a)
#   display_name — dashboard label; KNOTCH_LLM=fake uses this for narrow routing
#                  (a display_name substring in an utterance routes to that role).
#                  Keep names short and distinct to avoid false matches.
#   voice_id     — STT-side identity; "" if your TTS adapter does not use it.
roles:
  - role_id: role_a
    display_name: "Role A"
    voice_id: "Magpie-ZeroShot.Male-1"

  - role_id: role_b
    display_name: "Role B"
    voice_id: "Magpie-ZeroShot.Male-2"

# Filenames are relative to this directory.
routing_policy: routing_policy.md
rubric: rubric.yaml
scenarios: scenarios.yaml
