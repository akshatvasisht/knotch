# One expect entry per utterance, in the same order as the utterances list.
# The eval runner matches them positionally.
#
# Schema:
#   scenarios:
#     - id: <string>
#       utterances: [ { participant: <role_id>, text: <string> } ]
#       expect:     [ { route_to: <role_id or []>, about: <role_id>, signal: <signal_type or "held"> } ]
#
#   route_to: role_id to receive the routed message, or [] for a held decision.
#   about:    role_id the message concerns (normally the speaker).
#   signal:   signal_type from routing_policy.md, or "held" when route_to is [].
#
# KNOTCH_LLM=fake is keyword-driven: urgency cues (down, stuck, now, help, ...)
# broadcast; question/"need"/"where" phrasing routes as request; a display_name
# in the text routes narrowly to that role; everything else is held. Include
# at least one all-held scenario to test the misroute rate.

scenarios:

  # TODO: Replace with a realistic routing scenario for your domain.
  - id: example_routing_scenario
    utterances:
      - { participant: role_a, text: "I'm stuck and need help right now" }
      - { participant: role_b, text: "on it" }
    expect:
      - { route_to: role_b, about: role_a, signal: dependency }
      - { route_to: [],     about: role_b, signal: held }

  # TODO: Replace with chatter/backchannels that should all be held.
  - id: all_chatter_no_routes
    utterances:
      - { participant: role_a, text: "quiet stretch, nothing flagged" }
      - { participant: role_b, text: "yeah, all clear here" }
    expect:
      - { route_to: [], about: role_a, signal: held }
      - { route_to: [], about: role_b, signal: held }

  # TODO: Add a named-owner request: use a display_name in the utterance text
